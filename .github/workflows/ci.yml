name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest
      - name: Documentation check
        run: python scripts/check_docs.py
      - name: Verify required workflow contract
        run: python scripts/check_independent_verification.py
      - name: Verify pull request evidence and governed boundaries
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" > .verification-live-pr.json
          gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename' > .verification-changed-files.txt
          head_sha="$(jq -r '.head.sha' .verification-live-pr.json)"
          gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&per_page=100" > .verification-run-pages.json
          jq -cr --arg repository "$GITHUB_REPOSITORY" '.[] | .workflow_runs[] | {repository: $repository, event: .event, pull_request_numbers: (if (.pull_requests | type) == "array" then [.pull_requests[].number] else null end), workflow_id: .workflow_id, workflow_path: .path, run_id: .id, head_sha: .head_sha}' .verification-run-pages.json > .verification-runs.ndjson
          : > .verification-check-runs.ndjson
          while IFS= read -r run; do
            run_id="$(jq -r '.run_id' <<<"$run")"
            gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              | jq -cr --argjson run "$run" '.[] | .jobs[] | select(.name == "validate" or .name == "docs-check" or .name == "fixtures" or .name == "security") | {repository: $run.repository, event: $run.event, pull_request_numbers: $run.pull_request_numbers, workflow_id: $run.workflow_id, workflow_path: $run.workflow_path, run_id: $run.run_id, job_run_id: $run.run_id, job_id: .id, check_name: .name, status: (if .status == "completed" then (if .conclusion == "success" then "success" else "failure" end) else "pending" end), conclusion: .conclusion, head_sha: $run.head_sha}' \
              >> .verification-check-runs.ndjson
          done < .verification-runs.ndjson
          jq --arg repository "$GITHUB_REPOSITORY" --argjson check_runs "$(jq -s '.' .verification-check-runs.ndjson)" '{repository: $repository, pull_request_number: .number, base_ref: .base.ref, base_sha: .base.sha, head_ref: .head.ref, head_sha: .head.sha, body: (.body // ""), changed_file_inventory_complete: true, required_check_runs_complete: true, required_check_runs: $check_runs}' .verification-live-pr.json > .verification-live-pr-state.json
          python scripts/check_independent_verification.py --live-pr-state .verification-live-pr-state.json --changed-files .verification-changed-files.txt
